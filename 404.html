<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Страница не найдена — HASAD Events</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050506">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/brand/favicon-32.png">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    :root { color-scheme: dark; --bg: #050506; --text: #f4f4f6; --muted: #8e9098; --pink: #ff3d97; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body {
      display: grid; place-items: center; text-align: center;
      padding: 24px max(16px, env(safe-area-inset-left)) 24px max(16px, env(safe-area-inset-right));
      font-family: 'Manrope', system-ui, sans-serif;
      background: radial-gradient(60% 45% at 50% 40%, rgba(255, 61, 151, 0.18), transparent 70%), var(--bg);
    }
    img { width: min(80vw, 560px); height: auto; filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.6)); }
    h1 { margin: 28px 0 10px; font: 500 clamp(22px, 4vw, 34px)/1.15 'Unbounded', system-ui, sans-serif; }
    p { margin: 0 0 28px; color: var(--muted); }
    a {
      display: inline-flex; align-items: center; height: 54px; padding: 0 28px; border-radius: 999px;
      font: 500 14px 'Unbounded', system-ui, sans-serif; color: #fff; text-decoration: none;
      background: radial-gradient(120% 150% at 30% 0%, #ffa8d1 0%, #ff4fa0 36%, #e2207f 70%, #a80d58 100%);
      box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.55), 0 14px 34px -10px rgba(255, 61, 151, 0.42);
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/brand/hasad-chrome@2x.webp" alt="HASAD" width="2346" height="620">
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка.</p>
    <a href="/">На главную HASAD Events</a>
  </main>
</body>
</html>
